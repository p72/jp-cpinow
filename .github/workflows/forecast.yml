name: forecast

# 平日 12:07 と 16:43 JST に設定（GitHub の定時実行は数時間遅れることがあるため前倒し）。
# 全国CPI・東京都区部CPI（8:30）、日銀 企業物価（8:50）、石油製品小売市況（水曜）の公表を拾う。
# 前回から新しい（または改定された）データがあるときだけ予測を記録し、data/ と output/ をコミットする。
# 手動実行は Actions タブの "Run workflow"。
on:
  schedule:
    - cron: "7 3 * * 1-5"    # 03:07 UTC = 12:07 JST
    - cron: "43 7 * * 1-5"   # 07:43 UTC = 16:43 JST
  workflow_dispatch:
    inputs:
      force:
        description: "新しいデータが無くても実行して記録する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
      JP_CPINOW_HOME: ${{ github.workspace }}/data
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージ
        run: pip install -r requirements.txt

      - name: 予測
        run: |
          set -o pipefail
          FLAG="--only-if-new"
          if [ "${{ inputs.force }}" = "true" ]; then FLAG=""; fi
          mkdir -p output
          python -m scripts.cli forecast $FLAG --out output 2>&1 | grep -v -E "page [0-9]+:|findfont" | tee output/last_run.log

      # 実行ログの要点を注釈（annotation）に出す。Actions の画面のほか API でも読める。
      - name: ログの要点
        if: always()
        run: |
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          [ -f output/last_run.log ] || exit 0
          echo "::notice title=取得・予測::$(grep -E '^\[|最新の公表月|^20[0-9][0-9]-[0-9][0-9]' output/last_run.log | head -25 | enc)"
          if grep -qE 'Traceback|Error|failed' output/last_run.log; then
            echo "::warning title=エラー・警告::$(grep -n -E 'Traceback|Error|failed' output/last_run.log | head -5 | enc)%0A---%0A$(tail -25 output/last_run.log | enc)"
          fi

      - name: 結果をコミット
        run: |
          git config user.name "jp-cpinow bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "forecast $(date +%F) (自動実行)"
            git push
          fi
